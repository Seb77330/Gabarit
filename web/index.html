<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabarit</title>
<meta name="description" content="Gabarit, logiciel de conception 3D gratuit, dans ton navigateur.">
<meta name="theme-color" content="#1d2733">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Gabarit</span></div>
    <input id="docName" class="doc-name" spellcheck="false" aria-label="Nom de la pièce">
    <nav class="file">
      <button data-act="new" title="Nouvelle pièce">Nouveau</button>
      <button data-act="open" title="Ouvrir une pièce (.gabarit)">Ouvrir</button>
      <button data-act="save" title="Enregistrer (Ctrl+S)">Enregistrer</button>
      <span class="sep"></span>
      <button data-act="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
      <button data-act="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
      <span class="sep"></span>
      <button data-act="stl" class="accent" title="Pour l’impression 3D">Exporter STL</button>
      <button data-act="step" title="Pour les autres logiciels de CAO">Exporter STEP</button>
      <button data-act="help" title="Aide" aria-label="Aide">?</button>
    </nav>
  </header>
  <div class="tools" id="tools"></div>
  <main>
    <aside class="tree"><h2>Historique</h2><div id="tree"></div><div class="params-box"><h2>Paramètres <button class="mini" data-act="addParam">+ Ajouter</button></h2><div id="params"></div></div></aside>
    <section class="stage">
      <div id="view"></div>
      <div id="banner" class="banner" hidden></div>
      <div class="views" id="views"></div>
      <div id="busy" class="busy" hidden><span></span>Calcul…</div>
      <div id="sketch" class="sketch" hidden>
        <div class="sk-tools" id="skTools"></div>
        <svg id="skSvg"></svg>
        <div class="sk-hint" id="skHint"></div>
      </div>
      <div id="welcome" class="welcome" hidden></div>
    </section>
    <aside class="props" id="props"></aside>
  </main>
  <footer class="status" id="status"></footer>
</div>
<input type="file" id="fileIn" accept=".gabarit,.json,application/json" hidden>
<div id="toast" class="toast" hidden></div>
<dialog id="dlg"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
